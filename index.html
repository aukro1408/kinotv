<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Пацюк Кино · TV</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ============ ПАЦЮК КИНО · TV ============ */
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#0c0f16; --bg2:#111623; --card:#182032; --card2:#1f2940;
  --accent:#2f7bff; --accent2:#5b9bff;
  --text:#fff; --muted:#8f99b0; --line:rgba(255,255,255,.09);
  --r:.6em;
}
html{font-size:16px}
body{background:var(--bg);color:var(--text);font-family:'Manrope',system-ui,sans-serif;
  overflow:hidden;height:100vh;width:100vw;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
img{display:block}
::-webkit-scrollbar{display:none}
:focus{outline:none}

/* ---------- каркас ---------- */
#app{display:flex;height:100vh;width:100vw}
/* сайдбар — как в Lampa: узкая вертикальная панель иконок */
#sidebar{width:4.6em;flex:0 0 auto;background:rgba(0,0,0,.35);border-right:1px solid var(--line);
  display:flex;flex-direction:column;align-items:center;padding:.9em 0;gap:.35em;z-index:20}
.sb-logo{width:2.6em;height:2.6em;border-radius:50%;background:linear-gradient(135deg,#2f7bff,#7b5bff);
  display:flex;align-items:center;justify-content:center;font-size:1.15em;margin-bottom:.7em}
.sb-btn{width:3.2em;height:3.2em;border-radius:.8em;display:flex;align-items:center;justify-content:center;
  color:var(--muted);position:relative;transition:background .15s}
.sb-btn svg{width:1.5em;height:1.5em}
.sb-btn .sb-tip{position:absolute;left:calc(100% + .7em);top:50%;transform:translateY(-50%) scale(.9);
  background:#000;border:1px solid var(--line);padding:.35em .8em;border-radius:.5em;font-size:.85em;
  font-weight:700;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .15s;z-index:50}
.sb-btn.focused{background:rgba(255,255,255,.1);color:#fff}
.sb-btn.focused .sb-tip{opacity:1}
.sb-btn.active{color:var(--accent2)}
.sb-btn.active::before{content:'';position:absolute;left:-.85em;top:20%;bottom:20%;width:.25em;
  border-radius:.2em;background:var(--accent)}
.sb-space{flex:1}
.sb-clock{font-size:.8em;color:var(--muted);font-weight:700}

#main{flex:1;min-width:0;position:relative;overflow:hidden}
.screen{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;padding:1.6em 2em 3em;
  display:none;scrollbar-width:none}
.screen.on{display:block}

/* ---------- фокус (пульт) ---------- */
.focused{position:relative;z-index:5}
.card.focused{transform:scale(1.07);z-index:6}
.card.focused .card__poster{box-shadow:0 0 0 .18em #fff,0 .8em 2em rgba(0,0,0,.5)}
.btn.focused,.sb-btn.focused,.pill.focused,.src.focused,.opt.focused,.set-row.focused{
  box-shadow:0 0 0 .16em #fff}
.btn.focused{background:rgba(255,255,255,.14)}
.pill.focused{background:rgba(255,255,255,.16)}
.src.focused{background:var(--card2)}
.opt.focused{background:rgba(47,123,255,.25)}

/* ---------- кнопки ---------- */
.btn{display:inline-flex;align-items:center;gap:.6em;padding:.75em 1.6em;border-radius:.7em;
  background:var(--card);font-weight:800;font-size:1.02em;border:1px solid var(--line)}
.btn.primary{background:var(--accent);border-color:var(--accent)}
.btn svg{width:1.2em;height:1.2em}

/* ---------- hero (главная) ---------- */
.hero{position:relative;height:23em;border-radius:1em;overflow:hidden;margin-bottom:1.8em;
  background:var(--bg2);flex:0 0 auto}
.hero__bg{position:absolute;inset:0}
.hero__bg img{width:100%;height:100%;object-fit:cover}
.hero__shade{position:absolute;inset:0;
  background:linear-gradient(90deg,rgba(8,10,16,.96) 20%,rgba(8,10,16,.55) 55%,rgba(8,10,16,.05) 85%)}
.hero__body{position:absolute;left:2.2em;bottom:2em;right:2em;max-width:38em}
.hero__kicker{font-size:.85em;font-weight:800;color:var(--accent2);letter-spacing:.14em;
  text-transform:uppercase;margin-bottom:.5em}
.hero__title{font-size:2.5em;font-weight:800;line-height:1.05;margin-bottom:.35em}
.hero__meta{display:flex;gap:.9em;align-items:center;color:var(--muted);font-weight:700;
  font-size:1em;margin-bottom:1.1em}
.hero__meta .rate{color:#ffcf3f}
.hero__btns{display:flex;gap:.8em}

/* ---------- ряды ---------- */
.row{margin-bottom:1.7em}
.row__head{display:flex;align-items:baseline;gap:1em;margin-bottom:.7em;padding:0 .2em}
.row__title{font-size:1.25em;font-weight:800}
.row__more{margin-left:auto;color:var(--muted);font-weight:700;font-size:.95em;
  padding:.4em .9em;border-radius:.5em}
.row__more.focused{color:#fff}
.row__line{display:flex;gap:1em;overflow-x:auto;padding:.7em .2em .9em;scrollbar-width:none}

/* ---------- карточка ---------- */
.card{flex:0 0 auto;width:9.2em;transition:transform .16s ease;position:relative}
.card__poster{position:relative;aspect-ratio:2/3;border-radius:var(--r);overflow:hidden;
  background:var(--card)}
.card__poster img{width:100%;height:100%;object-fit:cover}
.card__badge{position:absolute;top:.45em;left:.45em;background:rgba(0,0,0,.72);backdrop-filter:blur(4px);
  font-size:.78em;font-weight:800;padding:.28em .6em;border-radius:.45em;color:#ffcf3f}
.card__title{font-size:.88em;font-weight:700;margin-top:.55em;line-height:1.3;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.3em}
.card__sub{font-size:.78em;color:var(--muted);font-weight:600;margin-top:.15em}
/* широкая карточка 16:9 */
.card--wide{width:17em}
.card--wide .card__poster{aspect-ratio:16/9}
.card__badge--date{color:#fff;background:rgba(47,111,237,.88)}
.card__badge--new{background:#22c55e;color:#fff}
.card__badge--bell{background:rgba(0,0,0,.72);color:#fff}
/* плашки стримингов */
.studio-tile{flex:0 0 auto;min-width:10.5em;padding:1.15em 1.2em;border-radius:.8em;
  background:#fff;border:1px solid var(--line);
  font-weight:800;font-size:1.02em;color:var(--stc,#101014);text-align:center;
  transition:transform .16s ease}
.studio-tile.focused{transform:scale(1.06);box-shadow:0 0 0 .16em #fff}
/* карточки коллекций */
.col-card{flex:0 0 auto;width:17em;transition:transform .16s ease}
.grid .col-card{width:auto}
.col-card__cover{position:relative;aspect-ratio:16/9;border-radius:var(--r);overflow:hidden;background:var(--card)}
.col-card__cover img{width:100%;height:100%;object-fit:cover}
.col-card__shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.05),rgba(0,0,0,.65))}
.col-card__count{position:absolute;left:.7em;bottom:.55em;font-size:.8em;font-weight:800;color:#fff;
  background:rgba(0,0,0,.6);padding:.25em .65em;border-radius:2em}
.col-card.focused{transform:scale(1.05);z-index:6}
.col-card.focused .col-card__cover{box-shadow:0 0 0 .18em #fff,0 .8em 2em rgba(0,0,0,.5)}
/* кнопка «Показать ещё» в категории */
.cat-more{display:flex;justify-content:center;padding:1.5em 0 2.5em}

/* ---------- сетка ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(9.2em,1fr));gap:1.2em .9em;
  padding:.7em .2em}
.grid .card{width:auto}
.tabs{display:flex;gap:.6em;margin-bottom:1.2em;flex-wrap:wrap}
.pill{padding:.55em 1.3em;border-radius:2em;background:var(--card);font-weight:700;
  border:1px solid var(--line);font-size:.98em}
.pill.on{background:var(--accent);border-color:var(--accent)}

/* ---------- страница фильма ---------- */
.mv-back{position:relative;height:19em;margin:-1.6em -2em 0;overflow:hidden}
.mv-back img{width:100%;height:100%;object-fit:cover}
.mv-back::after{content:'';position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(12,15,22,.25),rgba(12,15,22,.92) 85%,var(--bg))}
.mv-wrap{position:relative;margin-top:-7em;display:flex;gap:1.8em}
.mv-poster{width:11.5em;flex:0 0 auto}
.mv-poster img{width:100%;aspect-ratio:2/3;object-fit:cover;border-radius:.7em;
  box-shadow:0 1em 3em rgba(0,0,0,.5)}
.mv-info{flex:1;min-width:0;padding-top:5.2em}
.mv-title{font-size:2em;font-weight:800;line-height:1.1;margin-bottom:.3em}
.mv-orig{color:var(--muted);font-weight:600;margin-bottom:.6em}
.mv-meta{display:flex;gap:1em;flex-wrap:wrap;align-items:center;font-weight:700;margin-bottom:1em}
.mv-meta .rate{color:#ffcf3f;font-size:1.15em}
.mv-meta .q{background:var(--card);border:1px solid var(--line);padding:.25em .7em;border-radius:.4em;
  font-size:.85em}
.mv-btns{display:flex;gap:.8em;margin-bottom:1.3em;flex-wrap:wrap}
.mv-desc{color:#c9d1e3;line-height:1.65;font-size:1.02em;max-width:52em;margin-bottom:1.6em}
.mv-sec{font-size:1.2em;font-weight:800;margin:0 0 .8em}
.src{background:var(--card);border:1px solid var(--line);border-radius:.7em;
  padding:1em 1.3em;margin-bottom:.7em;display:flex;align-items:center;gap:1em;width:100%;text-align:left}
.src__t{font-weight:800;font-size:1.05em}
.src__s{color:var(--muted);font-size:.88em;font-weight:600;margin-top:.15em}
.src__go{margin-left:auto;color:var(--muted);font-size:1.3em}

/* ---------- поиск + клавиатура ---------- */
.search-box{display:flex;gap:1em;margin-bottom:1.4em}
.search-input{flex:1;background:var(--card);border:1px solid var(--line);border-radius:.7em;
  padding:.8em 1.2em;font-size:1.15em;font-weight:700;color:#fff;min-width:0}
input.search-input{font:inherit}
input.search-input::placeholder{color:var(--muted);font-weight:600}
.search-input.focused{box-shadow:0 0 0 .16em #fff}

/* ---------- настройки ---------- */
.set{max-width:44em}
.set-row{display:flex;align-items:center;gap:1em;background:var(--card);
  border:1px solid var(--line);border-radius:.7em;padding:1em 1.3em;margin-bottom:.7em;width:100%;
  text-align:left}
.set-row__t{font-weight:800;font-size:1.05em}
.set-row__s{color:var(--muted);font-size:.88em;margin-top:.15em;word-break:break-all}
.set-row .val{margin-left:auto;color:var(--accent2);font-weight:700;flex:0 0 auto;max-width:16em;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.set-cap{font-size:1.25em;font-weight:800;margin:1.4em 0 .8em}
.set-cap:first-child{margin-top:0}

/* ---------- шторка ---------- */
#veil{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;z-index:90;
  align-items:center;justify-content:center}
#veil.on{display:flex}
.sheet{background:var(--bg2);border:1px solid var(--line);border-radius:1em;
  width:min(34em,90vw);max-height:80vh;overflow-y:auto;padding:1.4em}
.sheet__t{font-size:1.3em;font-weight:800;margin-bottom:1em}
.opt{display:flex;align-items:center;gap:1em;width:100%;text-align:left;background:var(--card);
  border:1px solid var(--line);border-radius:.7em;padding:1em 1.2em;margin-bottom:.6em}
.opt__t{font-weight:800;font-size:1.05em}
.opt__s{color:var(--muted);font-size:.88em;margin-top:.1em}
.opt .tick{margin-left:auto;color:var(--accent2);font-size:1.3em;font-weight:800}

/* ---------- плеер ---------- */
#player{position:fixed;inset:0;background:#000;z-index:100;display:none}
#player.on{display:block}
#player video{width:100%;height:100%}
.pv-ui{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;
  background:linear-gradient(180deg,rgba(0,0,0,.45),transparent 30%,transparent 65%,rgba(0,0,0,.75));
  opacity:0;transition:opacity .3s;padding:1.5em 2em}
#player.showui .pv-ui{opacity:1}
.pv-title{position:absolute;top:1.2em;left:2em;font-size:1.2em;font-weight:800}
.pv-bar{height:.4em;background:rgba(255,255,255,.25);border-radius:.3em;margin-bottom:1em;position:relative}
.pv-fill{position:absolute;left:0;top:0;bottom:0;background:var(--accent);border-radius:.3em}
.pv-row{display:flex;gap:1em;align-items:center}
.pv-btn{width:3em;height:3em;border-radius:50%;background:rgba(255,255,255,.12);
  display:flex;align-items:center;justify-content:center}
.pv-btn svg{width:1.4em;height:1.4em}
.pv-btn.focused{box-shadow:0 0 0 .16em #fff;background:rgba(255,255,255,.25)}
.pv-time{margin-left:auto;font-weight:700;color:#dfe6f5}
#pvSeek{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) scale(.9);
  font-size:2.2em;font-weight:800;color:#fff;background:rgba(0,0,0,.65);
  padding:.4em 1em;border-radius:1em;opacity:0;transition:opacity .18s, transform .18s;pointer-events:none}
#pvSeek.on{opacity:1;transform:translate(-50%,-50%) scale(1)}

/* ---------- тост ---------- */
#toast{position:fixed;left:50%;bottom:2.5em;transform:translateX(-50%) translateY(1em);
  background:rgba(10,13,20,.94);border:1px solid var(--line);padding:.8em 1.5em;border-radius:.7em;
  font-weight:700;opacity:0;transition:all .25s;z-index:200;pointer-events:none;max-width:80vw;
  text-align:center}
#toast.on{opacity:1;transform:translateX(-50%)}

.empty{color:var(--muted);text-align:center;padding:4em 1em;font-size:1.1em;font-weight:600}
.h1{font-size:1.7em;font-weight:800;margin-bottom:1em}
.load{display:flex;align-items:center;justify-content:center;padding:4em;color:var(--muted);
  font-weight:700;font-size:1.1em}
.spin{width:2em;height:2em;border:.25em solid var(--line);border-top-color:var(--accent);
  border-radius:50%;animation:sp 1s linear infinite;margin-right:.8em}
@keyframes sp{to{transform:rotate(360deg)}}

/* ---------- источники (портировано из «Кино», ТВ-стили) ---------- */
.vw-head{display:flex;align-items:center;gap:1.2em;margin-bottom:1.2em}
.vw-kicker{font-size:.85em;font-weight:800;color:var(--accent2);letter-spacing:.14em;text-transform:uppercase}
.vw-title{font-size:1.7em;font-weight:800}
.vw-meta{color:var(--muted);font-weight:700}
.vw-meta .rate{color:#ffcf3f}
.vw-q{background:var(--card);border:1px solid var(--line);padding:.25em .7em;border-radius:.4em;font-size:.85em;font-weight:800}
.vw-watch{display:inline-flex;align-items:center;gap:.6em;padding:.75em 1.6em;border-radius:.7em;
  background:var(--accent);font-weight:800;font-size:1.02em;margin:.8em 0}
.vw-watch svg{width:1.2em;height:1.2em;fill:#fff}
.vw-sub{color:var(--muted);font-weight:600;margin-bottom:1em}
.vw-pills{display:flex;gap:.6em;flex-wrap:wrap;margin-bottom:1.2em}
.vw-pill{padding:.55em 1.3em;border-radius:2em;background:var(--card);font-weight:700;border:1px solid var(--line);font-size:.98em}
.vw-pill.on{background:var(--accent);border-color:var(--accent)}
.vw-sec-t{font-size:1.2em;font-weight:800;margin:1.2em 0 .7em}
.vw-load{color:var(--muted);font-weight:700;padding:3em;text-align:center;font-size:1.05em}
.vw-list{display:flex;flex-direction:column;gap:.6em;max-width:56em}
.vw-voice{display:flex;align-items:center;justify-content:space-between;gap:1em;width:100%;
  padding:1em 1.3em;border-radius:.7em;text-align:left;border:1px solid var(--line);
  background:var(--card);font-size:1.02em;font-weight:700}
.vw-voice .vs{font-size:.82em;color:var(--muted);font-weight:600;margin-top:.2em}
.vw-voice.focused{background:var(--card2)}
.vw-backline{color:var(--muted);font-weight:800;font-size:1.05em;padding:.6em 0;text-align:left}
.vw-backline.focused{color:#fff}
.vw-ep{display:flex;gap:1em;align-items:center;padding:.8em 1em;border-radius:.7em;text-align:left;width:100%;
  border:1px solid var(--line);background:var(--card)}
.vw-ep.focused{background:var(--card2)}
.vw-epbody{flex:1;min-width:0}
.vw-ept{display:block;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vw-eps{display:block;font-size:.85em;color:var(--muted);font-weight:600;margin-top:.25em}
.vw-eps .rate{color:#ffcf3f;font-weight:800}
.vw-num{font-size:1.4em;font-weight:800;color:var(--muted);flex:0 0 auto;min-width:2em;text-align:center}
.vw-thumb{width:7em;aspect-ratio:16/9;object-fit:cover;border-radius:.4em;flex:0 0 auto}
.vw-side{display:flex;flex-direction:column;align-items:flex-end;gap:.4em;flex:0 0 auto}
.vw-prog{height:.25em;border-radius:.2em;background:rgba(255,255,255,.1);margin-top:.5em;overflow:hidden}
.vw-prog i{display:block;height:100%;background:var(--accent);border-radius:.2em}
.vw-done{color:#7ee2a8;font-size:.85em;font-weight:800}
</style>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.13/dist/hls.min.js"></script>
</head>
<body>
<div id="app">
  <nav id="sidebar" aria-label="Меню"></nav>
  <main id="main"></main>
</div>

<div id="veil"><div class="sheet" id="sheetBox" role="dialog"></div></div>

<div id="player">
  <video id="pvVideo" playsinline></video>
  <div class="pv-ui" id="pvUI">
    <div class="pv-title" id="pvTitle"></div>
    <div class="pv-bar" id="pvBar"><div class="pv-fill" id="pvFill"></div></div>
    <div class="pv-row" id="pvRow"></div>
  </div>
</div>

<div id="toast"></div>
<script>
'use strict';
/* =====================================================================
   ПАЦЮК КИНО · TV — ТВ-приложение (пульт, Lampa-организация)
   ===================================================================== */

/* ---------- масштаб: всё в em от высоты экрана (как в Lampa) ---------- */
function fitScale(){
  const h = window.innerHeight || 720;
  document.documentElement.style.fontSize = (h/45).toFixed(2) + 'px';
}
window.addEventListener('resize', fitScale);
fitScale();

/* ---------- helpers ---------- */
const $ = s=>document.querySelector(s);
const $$ = s=>[...document.querySelectorAll(s)];
const escTx = s=>String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
let toastT=0;
function toast(msg, ms){
  const t=$('#toast'); t.textContent=msg; t.classList.add('on');
  clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('on'), ms||2600);
}
function fmtDate(d){
  if(!d) return '';
  const m=['янв','фев','мар','апр','мая','июн','июл','авг','сен','окт','ноя','дек'];
  const x=new Date(d+'T00:00:00'); if(isNaN(x)) return d;
  return x.getDate()+' '+m[x.getMonth()];
}

/* ================= LS + STATE (общие ключи с «Кино» — один origin) ================= */
const LS = {
  get(k, d){ try{ const v = localStorage.getItem('kino.'+k); return v===null? d : JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem('kino.'+k, JSON.stringify(v)); }catch(e){} }
};
const state = {
  tmdbKey: LS.get('tmdb_key',''),
  tsUrl: LS.get('ts_url','http://127.0.0.1:8090'),
  tsUrlHttp: LS.get('ts_url_http',''),
  jacUrl: LS.get('jac_url','https://jac.red'),
  jacKey: LS.get('jac_key',''),
  fxToken: LS.get('fx_token',''),
  fxProxy: LS.get('fx_proxy','https://cors.jacred.stream/'),
  rzProxy: LS.get('rz_proxy',''),
  rzCookie: LS.get('rz_cookie',''),
  favs: LS.get('favs', {like:[], later:[], mark:[]}),
  history: LS.get('history', []),
  hidden: LS.get('hidden', []),
  liked: LS.get('liked', []),
  torQ: LS.get('tor_qmode','orig_ru_year'),
  defPlayer: LS.get('def_player','ask'),
};
const VID_EXT = ['.mp4','.mkv','.avi','.ts','.m2ts','.webm','.mov','.mpg','.mpeg'];
const plural=(n,a,b,c)=>{const m10=n%10,m100=n%100;return m10===1&&m100!==11?a:(m10>=2&&m10<=4&&(m100<12||m100>14)?b:c);};
const shortName=p=>{p=p||'';const i=Math.max(p.lastIndexOf('/'),p.lastIndexOf('\\'));return i>=0?p.slice(i+1):p;};

const NAV = { cur:null, mem:{}, prev:null, layer:'app' };
const NAV_SEL = '.sb-btn, .screen.on .btn, .screen.on .card, .screen.on .col-card, .screen.on .studio-tile, .screen.on .pill, .screen.on .src, .screen.on .opt, .screen.on .row__more, .screen.on .vw-voice, .screen.on .vw-pill, .screen.on .vw-ep, .screen.on .vw-backline, .screen.on .vw-watch, .screen.on .search-input, .screen.on .set-row, #veil.on .opt, #veil.on .btn, #player.on .pv-btn';
function navR(el){
  const r = el.getBoundingClientRect();
  return {l:r.left, t:r.top, r:r.right, b:r.bottom, cx:r.left+r.width/2, cy:r.top+r.height/2, w:r.width, h:r.height};
}
function navVisible(el){
  if(!el || !el.isConnected) return false;
  const r = el.getBoundingClientRect();
  if(r.width < 4 || r.height < 4) return false;
  const cs = getComputedStyle(el);
  if(cs.display==='none' || cs.visibility==='hidden' || +cs.opacity===0) return false;
  const vw = window.innerWidth;
  if(r.right <= 0 || r.left >= vw) return false;
  if(r.bottom <= -40 || r.top >= window.innerHeight+40) return false;
  return true;
}
function navCollect(){
  let root;
  if($('#player').classList.contains('on')) root = $('#player');
  else if($('#veil').classList.contains('on')) root = $('#veil');
  else root = document;
  const scope = root===document ? '.screen.on' : '';
  const sel = root===document ? NAV_SEL
    : (root.id==='player' ? '#player.on .pv-btn' : '#veil.on .opt, #veil.on .btn');
  return [...new Set([...root.querySelectorAll(sel)])].filter(navVisible);
}
function navScroll(el){
  let p = el.parentElement;
  while(p && p!==document.body){
    const cs = getComputedStyle(p);
    if((cs.overflowX==='auto'||cs.overflowX==='scroll') && p.scrollWidth > p.clientWidth + 4) return p;
    p = p.parentElement;
  }
  return null;
}
function navEnsure(el){
  const hs = navScroll(el);
  const anchor = hs || el;
  const ar = anchor.getBoundingClientRect(), vw = window.innerWidth, vh = window.innerHeight;
  if(hs){
    const r = el.getBoundingClientRect();
    if(r.left < ar.left + 8) hs.scrollTo({left: hs.scrollLeft + (r.left - ar.left) - 40, behavior:'auto'});
    else if(r.right > ar.right - 8) hs.scrollTo({left: hs.scrollLeft + (r.right - ar.right) + 40, behavior:'auto'});
  }
  if(ar.top < 70 || ar.bottom > vh - 30){
    anchor.scrollIntoView({block:'nearest', behavior:'auto'});
    window.scrollBy(0, -10);
  }
}
function navSpatial(from, dir){
  const els = navCollect().filter(e=>e!==from);
  if(!els.length) return null;
  // возврат: обратный ход к источнику
  const pv = NAV.prev;
  if(pv && pv.dst===from){
    const want = {up:'down', down:'up', left:'right', right:'left'}[pv.rev];
    if(want===dir){
      const back = els.find(e=>e===pv.src) || null;
      if(back){ NAV.prev=null; return back; }
    }
  }
  const T = navR(from);
  const groups = {};
  els.forEach(e=>{
    const rc = navR(e);
    const x = rc.cx < T.l ? 0 : (rc.cx <= T.r ? 1 : 2);
    const y = rc.cy < T.t ? 0 : (rc.cy <= T.b ? 1 : 2);
    (groups[y*3+x] = groups[y*3+x] || []).push({el:e, rc});
  });
  const order = dir==='left' ? [3,0,6,4,1,7] : dir==='right' ? [5,2,8,4,1,7]
    : dir==='up' ? [1,0,2,4,6,8] : [7,6,8,4,0,2];
  const dist = (rc, straight)=>{
    const dx = Math.max(T.l - rc.r, 0, rc.l - T.r);
    const dy = Math.max(T.t - rc.b, 0, rc.t - T.b);
    return straight ? dx+dy : dx+dy + Math.abs(rc.cx-T.cx)*0.35 + Math.abs(rc.cy-T.cy)*0.35;
  };
  for(const g of order){
    const arr = groups[g]; if(!arr || !arr.length) continue;
    const straight = (g===3||g===5||g===1||g===7);
    arr.sort((a,b)=>dist(a.rc,straight)-dist(b.rc,straight));
    const pick = arr[0].el;
    NAV.prev = {src:from, dst:pick, rev:dir};
    return pick;
  }
  return null;
}
function navFocus(el){
  if(!el || !navVisible(el)) return false;
  if(NAV.cur) NAV.cur.classList.remove('focused');
  NAV.cur = el;
  el.classList.add('focused');
  try{ el.focus({preventScroll:true}); }catch(e){}
  NAV.mem[curScreen()] = el;
  navEnsure(el);
  return true;
}
function navMove(dir){
  const from = NAV.cur && navVisible(NAV.cur) ? NAV.cur : null;
  if(!from){
    const els = navCollect();
    if(els.length) navFocus(els[0]);
    return;
  }
  const next = navSpatial(from, dir);
  if(next) navFocus(next);
}
function navClick(){
  const el = NAV.cur;
  if(el) el.click();
}
function navBack(){
  if($('#player').classList.contains('on')){ closePlayer(); return; }
  if($('#veil').classList.contains('on')){ closeSheet(); return; }
  if(curScreen()==='movie'){ goScreen(lastMain || 'home'); return; }
  if(curScreen()==='view'){ goScreen('movie'); if(MV) paintMovie(MV); return; }

    goScreen(CATV.back || 'home'); return;
  }
  // уже на главном экране — ничего
}

/* ---------- клавиатура пульта ---------- */
let fldH = 0, edgeL = false, edgeR = false;
document.addEventListener('focusin', e=>{
  if(/INPUT|TEXTAREA/.test((e.target&&e.target.tagName)||'')){ fldH = window.innerHeight; edgeL = edgeR = false; }
});
document.addEventListener('keydown', e=>{
  if($('#player').classList.contains('on')) return;
  const k = e.key;
  const ae = document.activeElement;
  const inField = ae && /INPUT|TEXTAREA/.test(ae.tagName || '');
  if(inField){
    /* в поле ввода: текст — нативно (ПК-клавиатура, Ctrl+V).
       Как в Lampa: если системная клавиатура телика ужала вьюпорт — стрелки не трогаем. */
    const caretOK = window.innerHeight === fldH;
    if(k==='Enter'){
      e.preventDefault();
      if(ae.id==='sInput') doSearch();
      else if(ae.id==='aInput'){ const ok=$('#aOk'); if(ok) ok.click(); }
      ae.blur();
    } else if((k==='ArrowDown' || k==='ArrowUp') && caretOK){
      e.preventDefault(); ae.blur();
      navMove(k==='ArrowDown' ? 'down' : 'up');
    } else if(k==='ArrowLeft' && caretOK){
      /* влево в начале текста: первое нажатие — пометить, второе — выйти в навигацию */
      const atStart = (ae.selectionStart||0)===0 && (ae.selectionEnd||0)===0;
      if(atStart){ if(edgeL){ ae.blur(); navMove('left'); } edgeL = !edgeL; }
      else edgeL = false;
      edgeR = false;
    } else if(k==='ArrowRight' && caretOK){
      /* вправо в конце текста: первое нажатие — пометить, второе — выйти в навигацию */
      const v = ae.value||'', atEnd = (ae.selectionStart||0)>=v.length && (ae.selectionEnd||0)>=v.length;
      if(atEnd){ if(edgeR){ ae.blur(); navMove('right'); } edgeR = !edgeR; }
      else edgeR = false;
      edgeL = false;
    } else if(k==='Escape'){ ae.blur(); }
    else if(!['ArrowLeft','ArrowRight'].includes(k)){ edgeL = edgeR = false; }
    return;
  }
  if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Enter',' '].includes(k)) e.preventDefault();
  if(k==='ArrowLeft') navMove('left');
  else if(k==='ArrowRight') navMove('right');
  else if(k==='ArrowUp') navMove('up');
  else if(k==='ArrowDown') navMove('down');
  else if(k==='Enter' || k===' ') navClick();
  else if(k==='Escape' || k==='Backspace' || k==='BrowserBack' || k==='GoBack' || e.keyCode===4 || e.keyCode===8 || e.keyCode===461 || e.keyCode===10009){
    navBack();
  }
});

const MONTHS_RU = ['янв','фев','мар','апр','мая','июн','июл','авг','сен','окт','ноя','дек'];
function fmtPrmDate(ds){ const p=String(ds||'').split('-'); return p.length>=3 ? (+p[2])+' '+MONTHS_RU[(+p[1]||1)-1] : ds; }
function prmDateLabel(ds){
  const t = todayStr();
  if(!ds || ds<=t) return 'уже вышло';
  const n = Math.round((new Date(ds)-new Date(t))/864e5);
  if(n===1) return 'завтра';
  return 'через '+n+' '+plural(n,'день','дня','дней');
}
function epWhen(air){
  if(!air) return '';
  const d = new Date(air+'T00:00:00'), now = new Date();
  const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const dd = Math.round((d - today)/864e5);
  if(dd===0) return 'сегодня';
  if(dd===1) return 'завтра';
  if(dd===-1) return 'вчера';
  if(dd>1 && dd<7) return 'через '+dd+' '+plural(dd,'день','дня','дней');
  if(dd<-1 && dd>-7) return Math.abs(dd)+' '+plural(Math.abs(dd),'день','дня','дней')+' назад';
  return d.toLocaleDateString('ru-RU',{day:'numeric',month:'long'});
}
const GENRE_ID_BY_RU = {};
Object.keys(RU_GENRE).forEach(id=>{ if(!GENRE_ID_BY_RU[RU_GENRE[id]]) GENRE_ID_BY_RU[RU_GENRE[id]] = id; });
function likedVals(){ const v = LS.get('liked', {}); return Array.isArray(v) ? v : Object.values(v||{}); }
function hiddenIdSet(){
  const v = LS.get('hidden', {});
  const arr = Array.isArray(v) ? v : Object.values(v||{});
  return new Set(arr.map(x=>String(x && x.id!==undefined ? x.id : x)));
}
function buildTaste(){
  const weights = {};
  [['like',5],['mark',4],['later',3]].forEach(([k,w])=>{
    ((state.favs||{})[k]||[]).forEach(m=>{
      (m.genres||[]).forEach(g=>{
        const id = GENRE_ID_BY_RU[(g&&g.name)||g];
        if(id) weights[id] = (weights[id]||0)+w;
      });
    });
  });
  likedVals().forEach(m=>{
    (m.genres||[]).forEach(g=>{
      const id = GENRE_ID_BY_RU[(g&&g.name)||g];
      if(id) weights[id] = (weights[id]||0)+6;
    });
  });
  return Object.entries(weights).sort((a,b)=>b[1]-a[1]).slice(0,3).map(e=>e[0]);
}
async function forYouPayload(){
  const taste = buildTaste();
  if(!taste.length || !state.tmdbKey) return null;
  try{
    const d = await tmdb(`/discover/movie?with_genres=${taste.join(',')}&sort_by=vote_average.desc&vote_count.gte=100&primary_release_date.lte=${todayStr()}&page=1`);
    const items = (d.results||[]).map(r=>norm(r));
    if(!items.length) return null;
    return {items, genreIds: taste.join(',')};
  }catch(e){ return null; }
}
async function cubGet(path){
  const r = await fetch('https://cub.red/api/collections/'+path);
  if(!r.ok) throw new Error('cub '+r.status);
  return r.json();
}
function cubMovie(it){
  if(!it || (!it.title && !it.name)) return null;
  return norm(it, it.title ? undefined : 'tv');
}
/* --- порядок рядов: читаем настройки мобильной версии (общий localStorage) --- */
const HOME_ALL = ['studios','upcoming','newep','released','foryou','trend','new','top','tv','cols',...THEME_IDS];
function homeOrder(){
  let ord = LS.get('home_order', null);
  if(!Array.isArray(ord)) ord = HOME_ALL.slice();
  ord = ord.filter(id=>HOME_ALL.includes(id));
  HOME_ALL.forEach(id=>{ if(!ord.includes(id)) ord.push(id); });
  return ord;
}
function homeOff(id){ return !!((LS.get('home_off',{})||{})[id]); }
/* --- карточки рядов --- */
function prmCardHTML(m){
  return `<div class="card" data-id="${escTx(tvId(m))}" data-media="${m.media||'movie'}" tabindex="0">
    <div class="card__poster">${m.poster?`<img loading="lazy" src="${posterURL(m.poster)}" alt="">`:''}<div class="card__badge card__badge--date">${escTx(fmtPrmDate(m.date))}</div></div>
    <div class="card__title">${escTx(m.title)}</div>
    <div class="card__sub">${escTx(prmDateLabel(m.date))}</div></div>`;
}
function relCardHTML(p){
  return `<div class="card" data-id="${escTx(p.id)}" data-media="movie" tabindex="0">
    <div class="card__poster">${p.poster?`<img loading="lazy" src="${posterURL(p.poster)}" alt="">`:''}${p.seen?'':'<div class="card__badge card__badge--bell">🔔</div>'}</div>
    <div class="card__title">${escTx(p.title)}</div>
    <div class="card__sub">вышло ${escTx(fmtPrmDate(p.date))}</div></div>`;
}
function neCardHTML(t){
  const ep = (t.hasNew && t.lastEp) ? t.lastEp : (t.nextEp || t.lastEp);
  const badge = ep ? `S${ep.s} · E${ep.e}` : '';
  const sub = (t.hasNew && t.lastEp)
    ? `<b>Новая серия</b> · ${escTx(epWhen(t.lastEp.air))}`
    : (t.nextEp ? `Следующая · ${escTx(epWhen(t.nextEp.air))}` : (t.lastEp ? `Последняя · ${escTx(epWhen(t.lastEp.air))}` : ''));
  return `<div class="card" data-id="${escTx(t.id)}" data-media="tv" tabindex="0">
    <div class="card__poster">${t.poster?`<img loading="lazy" src="${posterURL(t.poster)}" alt="">`:''}${badge?`<div class="card__badge${t.hasNew?' card__badge--new':''}">${badge}</div>`:''}</div>
    <div class="card__title">${escTx(t.title)}</div>
    <div class="card__sub">${sub}</div></div>`;
}
function colCardHTML(c){
  const img = c.backdrop_path ? IMG+'w500'+c.backdrop_path : '';
  return `<div class="col-card" data-col="${c.id}" data-title="${escTx(c.title||'')}" tabindex="0">
    <div class="col-card__cover">${img?`<img loading="lazy" src="${img}" alt="">`:''}<div class="col-card__shade"></div>
      <div class="col-card__count">${c.items_count||0} ${plural(c.items_count||0,'фильм','фильма','фильмов')}</div></div>
    <div class="card__title">${escTx(c.title||'')}</div>
    <div class="card__sub">@${escTx(c.username||'cub')}</div></div>`;
}
const CATREG = {};
function regCat(key, desc){ CATREG[key] = desc; return key; }
function secHTML(title, items, catKey, cardFn){
  const cf = cardFn || cardHTML;
  return `<div class="row"><div class="row__head"><div class="row__title">${escTx(title)}</div>`
    + (catKey?`<button class="row__more" data-cat="${escTx(catKey)}">Ещё ›</button>`:'')
    + `</div><div class="row__line">${items.map(m=>cf(m)).join('')}</div></div>`;
}
function studiosRowHTML(){
  return `<div class="row"><div class="row__head"><div class="row__title">Стриминги</div></div>`
    + `<div class="row__line">` + STUDIOS_MINI.map((s,i)=>
      `<button class="studio-tile" data-st="${i}" tabindex="0" style="--stc:${s.color}"><span>${escTx(s.name)}</span></button>`
    ).join('') + `</div></div>`;
}
async function renderHome(){
  const box = $('#scr-home');
  if(!state.tmdbKey){
    box.innerHTML = '<div class="empty">Вставь TMDB-ключ в Настройках,<br>чтобы оживить главную 🐾</div>';
    return;
  }
  if(HOME.data){ paintHome(); return; }
  box.innerHTML = '<div class="load"><div class="spin"></div>Загружаю…</div>';
  try{
    const [tr, now, top, tvt, upc] = await Promise.all([
      tmdb('/trending/movie/week'), tmdb('/movie/now_playing?region=RU'),
      tmdb('/movie/top_rated'), tmdb('/trending/tv/week'),
      tmdb('/movie/upcoming?region=UA').catch(()=>null),
    ]);
    const T=(tr.results||[]).map(r=>norm(r)), N=(now.results||[]).map(r=>norm(r)),
          P=(top.results||[]).map(r=>norm(r)).sort((a,b)=>b.rating-a.rating),
          TT=(tvt.results||[]).map(r=>norm(r,'tv'));
    const UPC=((upc&&upc.results)||[]).map(r=>norm(r)).filter(x=>x.date).sort((a,b)=>a.date.localeCompare(b.date));
    HOME.hero = [...N].sort((a,b)=>(b.popularity||0)-(a.popularity||0))[0] || T[0];
    const themes = await Promise.all(THEME_ROWS.map(t=>
      tmdb(themeURL(t)).then(d=>({t, items:(d.results||[]).map(r=>norm(r))})).catch(()=>({t, items:[]}))));
    const fy = await forYouPayload();
    const cols = await cubGet('list?category=top').catch(()=>null);
    HOME.data = {T, N, P, TT, UPC, themes, fy, cols:((cols&&cols.results)||[]).slice(0,12)};
  }catch(e){ box.innerHTML = '<div class="empty">Не получилось загрузить 😕<br>'+escTx(e.message)+'</div>'; return; }
  paintHome();
}
function paintHome(){
  const box = $('#scr-home'), h = HOME.hero, D = HOME.data;
  if(!D) return;
  const hid = hiddenIdSet();
  const vis = items => (items||[]).filter(m=>{ const id=String(m.id); return !hid.has(id) && !hid.has(tvId(m)); });
  let html = '';
  if(h){
    html += '<div class="hero" data-id="'+escTx(tvId(h))+'" data-media="'+h.media+'" tabindex="0">'
      + '<div class="hero__bg">'+(h.backdrop?'<img src="'+backURL(h.backdrop)+'" alt="">':'')+'</div>'
      + '<div class="hero__shade"></div><div class="hero__body">'
      + '<div class="hero__kicker">Выбор редакции</div>'
      + '<div class="hero__title">'+escTx(h.title)+'</div>'
      + '<div class="hero__meta"><span class="rate">★ '+h.rating+'</span><span>'+escTx(h.year)+'</span><span>'+escTx((h.genres||[]).slice(0,2).join(' · '))+'</span></div>'
      + '<div class="hero__btns"><button class="btn primary" data-act="watch">'+ICO.play+' Смотреть</button></div>'
      + '</div></div>';
  }
  const now = todayStr();
  for(const id of homeOrder()){
    if(homeOff(id)) continue;
    if(id==='studios'){ html += studiosRowHTML(); continue; }
    if(id==='newep'){
      const items = Object.values(LS.get('tracked',{})||{}).filter(x=>{
        const ended = ['Ended','Canceled'].includes(x.status);
        return (!ended || x.hasNew) && (x.hasNew || x.nextEp);
      }).sort((a,b)=>((b.hasNew?1:0)-(a.hasNew?1:0)) || ((b.addedAt||0)-(a.addedAt||0))).slice(0,14);
      if(items.length) html += secHTML('Новые серии', items, null, neCardHTML);
      continue;
    }
    if(id==='released'){
      const rel = Object.values(LS.get('premieres',{})||{}).filter(p=>p.date && p.date<=now)
        .sort((a,b)=>b.date.localeCompare(a.date)).slice(0,14);
      if(rel.length) html += secHTML('Уже вышло', rel, null, relCardHTML);
      continue;
    }
    if(id==='upcoming'){
      const items = vis(D.UPC).filter(u=>u.date>now).slice(0,14);
      if(items.length) html += secHTML('Скоро выйдет', items,
        regCat('upcoming',{title:'Скоро выйдет', url:p=>`/movie/upcoming?region=UA&page=${p}`}), prmCardHTML);
      continue;
    }
    if(id==='foryou'){
      const items = D.fy ? vis(D.fy.items).slice(0,14) : [];
      if(items.length) html += secHTML('Для тебя', items,
        regCat('foryou',{title:'Для тебя', url:p=>`/discover/movie?with_genres=${D.fy.genreIds}&sort_by=vote_average.desc&vote_count.gte=100&primary_release_date.lte=${todayStr()}&page=${p}`}));
      continue;
    }
    if(id==='trend'){ const items=vis(D.T).slice(0,16); if(items.length) html += secHTML('В тренде', items, regCat('trend',{title:'В тренде', url:p=>`/trending/movie/week?page=${p}`})); continue; }
    if(id==='new'){ const items=vis(D.N).slice(0,16); if(items.length) html += secHTML('Сейчас в кино', items, regCat('new',{title:'Сейчас в кино', url:p=>`/movie/now_playing?region=RU&page=${p}`})); continue; }
    if(id==='top'){ const items=vis(D.P).slice(0,16); if(items.length) html += secHTML('Топ по рейтингу', items, regCat('top',{title:'Топ по рейтингу', url:p=>`/movie/top_rated?page=${p}`})); continue; }
    if(id==='tv'){ const items=vis(D.TT).slice(0,16); if(items.length) html += secHTML('Сериалы в тренде', items, regCat('tv',{title:'Сериалы в тренде', url:p=>`/trending/tv/week?page=${p}`, media:'tv'})); continue; }
    if(id==='cols'){
      if(D.cols.length) html += secHTML('Коллекции', D.cols, regCat('cols',{title:'Коллекции', cols:true}), colCardHTML);
      continue;
    }
    if(id.startsWith('th_')){
      const th = D.themes.find(x=>'th_'+x.t.id===id);
      if(th && th.items.length){
        const t = th.t, items = vis(th.items).slice(0,14);
        if(items.length) html += secHTML(t.title, items, regCat(id,{title:t.title, url:p=>themeURL(t,p), wide:!!t.wide}),
          t.wide ? (m=>cardHTML(m,true)) : null);
      }
      continue;
    }
  }
  box.innerHTML = html;
  bindCards(box);
  box.querySelectorAll('[data-cat]').forEach(b=>b.addEventListener('click', ()=>{ const c=CATREG[b.dataset.cat]; if(c) openCat(c); }));
  box.querySelectorAll('[data-col]').forEach(c=>c.addEventListener('click', ()=>openCollection(c.dataset.col, c.dataset.title)));
  box.querySelectorAll('[data-st]').forEach(b=>b.addEventListener('click', ()=>openStudio(+b.dataset.st)));
}
/* ================= КАТЕГОРИЯ (сетка с «Ещё») ================= */
const CATV = {desc:null, page:1, back:'home', prev:null};
function openCat(desc){
  CATV.prev = CATV.desc ? {desc:CATV.desc} : null;
  CATV.desc = desc; CATV.page = 1;
  if(curScr && curScr!=='cat') CATV.back = curScr;
  goScreen('cat');
}
function renderCat(){
  const box = $('#scr-cat'), d = CATV.desc;
  if(!d){ box.innerHTML=''; return; }
  box.innerHTML = `<div class="h1">${escTx(d.title)}</div><div class="grid" id="catGrid"></div><div class="cat-more" id="catMore"></div>`;
  catLoad();
}
async function catLoad(){
  const d = CATV.desc, grid = $('#catGrid'), moreBox = $('#catMore');
  if(!d || !grid) return;
  if(CATV.page===1) grid.innerHTML = '<div class="load"><div class="spin"></div>Загружаю…</div>';
  try{
    let hasMore = true;
    const tmp = document.createElement('div');
    if(d.cols){
      const j = await cubGet(`list?category=top&page=${CATV.page}`);
      const res = j.results||[];
      tmp.innerHTML = res.map(c=>colCardHTML(c)).join('');
      hasMore = res.length >= 20;
    } else if(d.cubView){
      const j = await cubGet(`view/${d.cubView}?page=${CATV.page}`);
      const res = j.results||[];
      tmp.innerHTML = res.map(cubMovie).filter(Boolean).map(m=>cardHTML(m)).join('');
      hasMore = res.length >= 20 && CATV.page < 60;
    } else {
      const j = await tmdb(d.url(CATV.page));
      const res = j.results||[];
      tmp.innerHTML = res.map(r=>norm(r, d.media)).map(m=>(d.wide?cardHTML(m,true):cardHTML(m))).join('');
      hasMore = CATV.page < (j.total_pages||1);
    }
    if(CATV.page===1) grid.innerHTML = '';
    bindCards(tmp);
    tmp.querySelectorAll('[data-col]').forEach(c=>c.addEventListener('click', ()=>openCollection(c.dataset.col, c.dataset.title)));
    while(tmp.firstChild) grid.appendChild(tmp.firstChild);
    if(CATV.page===1){
      const first = grid.querySelector('.card, .col-card');
      if(first && (!NAV.cur || !grid.contains(NAV.cur))) navFocus(first);
    }
    if(hasMore){
      moreBox.innerHTML = `<button class="btn" id="catMoreBtn">Показать ещё</button>`;
      $('#catMoreBtn').addEventListener('click', ()=>{ CATV.page++; $('#catMoreBtn').blur(); catLoad(); });
    } else moreBox.innerHTML = '';
  }catch(e){
    if(CATV.page===1) grid.innerHTML = '<div class="empty">Ошибка загрузки 😕</div>';
  }
}
function openCollection(id, title){
  openCat({title: title||'Коллекция', cubView:id});
}
function openStudio(i){
  const st = STUDIOS_MINI[i];
  if(!st) return;
  const go = media => {
    if(!studioURL(st, media, 1)) return;
    openCat({title: st.name+(media==='tv'?' · сериалы':''), url:p=>studioURL(st, media, p), media});
  };
  if(st.mv && st.tv) openSheet(st.name, [{t:'Фильмы'},{t:'Сериалы'}], idx=>go(idx===1?'tv':'movie'));
  else go(st.tv ? 'tv' : 'movie');
}

/* ================= КАТАЛОГ ================= */
const CAT = {movie:{tab:'pop', items:[], page:1}, tv:{tab:'pop', items:[], page:1}};
const CAT_TABS = {
  movie:[['pop','Популярные','/movie/popular'],['top','Топ','/movie/top_rated'],['now','Сейчас в кино','/movie/now_playing?region=RU'],['up','Скоро','/movie/upcoming?region=RU']],
  tv:[['pop','Популярные','/tv/popular'],['top','Топ','/tv/top_rated'],['air','Сейчас в эфире','/tv/on_the_air'],['today','Сегодня в эфире','/tv/airing_today']],
};
async function renderCatalog(media){
  const box = $(media==='movie' ? '#scr-movies' : '#scr-series');
  const tabs = CAT_TABS[media];
  box.innerHTML = '<div class="h1">'+(media==='movie'?'Фильмы':'Сериалы')+'</div>'
    + '<div class="tabs">'+tabs.map(t=>'<button class="pill'+(CAT[media].tab===t[0]?' on':'')+'" data-tab="'+t[0]+'">'+t[1]+'</button>').join('')+'</div>'
    + '<div class="grid" id="catGrid"></div>';
  box.querySelectorAll('.pill').forEach(p=>p.onclick=()=>{ CAT[media].tab=p.dataset.tab; CAT[media].page=1; renderCatalog(media); });
  await catLoad(media, box);
  bindCards(box);
}
async function catLoad(media, box){
  const st = CAT[media];
  const tab = CAT_TABS[media].find(t=>t[0]===st.tab);
  const grid = box.querySelector('#catGrid');
  grid.innerHTML = '<div class="load"><div class="spin"></div>Загружаю…</div>';
  try{
    const j = await tmdb(tab[2] + (tab[2].includes('?')?'&':'?') + 'page='+st.page);
    st.items = (j.results||[]).map(r=>norm(r, media));
    grid.innerHTML = st.items.map(m=>cardHTML(m)).join('');
  }catch(e){ grid.innerHTML = '<div class="empty">Ошибка загрузки 😕</div>'; }
}

function bindCards(root){
  root.querySelectorAll('.card').forEach(c=>{
    c.addEventListener('click', ()=>openMovie(c.dataset.id, c.dataset.media));
  });
  const hero = root.querySelector('.hero');
  if(hero){
    hero.addEventListener('click', e=>{
      if(e.target.closest('[data-act="watch"]')){ openMovie(hero.dataset.id, hero.dataset.media, true); }
      else openMovie(hero.dataset.id, hero.dataset.media);
    });
  }
}

/* ================= ЭКРАН ФИЛЬМА ================= */
let MV = null;
function favSnap(m){
  return {id: tvId(m), title:m.title, orig:m.orig||'', year:m.year||'', rating:m.rating||0,
    poster:m.poster||null, genres:(m.genres||[]).slice(0,3), media:m.media||'movie'};
}
function pushHistory(m){
  if(!m) return;
  const id = tvId(m), arr = state.history;
  const i = arr.findIndex(x=>String(x.id)===String(id));
  if(i!==-1) arr.splice(i,1);
  arr.unshift(favSnap(m));
  if(arr.length>100) arr.length = 100;
  LS.set('history', arr);
}
function isFav(id){
  return state.favs.like.some(x=>String(x.id)===String(id));
}
function toggleFav(m){
  const id = tvId(m), a = state.favs.like;
  const i = a.findIndex(x=>String(x.id)===String(id));
  if(i===-1){ a.unshift(favSnap(m)); toast('В избранном ❤'); }
  else { a.splice(i,1); toast('Убрано из избранного'); }
  LS.set('favs', state.favs);
  if(curScreen()==='movie' && MV && String(tvId(MV))===String(id)) paintMovie(MV);
  if(curScreen()==='fav') renderFav();
}
async function openMovie(id, media, autoplay){
  goScreen('movie');
  const box = $('#scr-movie');
  box.innerHTML = '<div class="load"><div class="spin"></div>Загружаю…</div>';
  const isTv = String(id).startsWith('tv') || media==='tv';
  const num = String(id).replace(/^tv/,'');
  const pre = [...state.history, ...state.favs.like].find(x=>String(x.id)===String(id));
  try{
    const d = await tmdb('/'+(isTv?'tv':'movie')+'/'+num+'?append_to_response=credits');
    const m = norm(d, isTv?'tv':'movie');
    m.cast = (((d.credits||{}).cast)||[]).slice(0,14);
    m.runtime = d.runtime || null;
    m.seasons = d.number_of_seasons || null;
    MV = m; pushHistory(m); paintMovie(m);
    if(autoplay) chooseSource(m);
  }catch(e){
    if(pre){ MV = Object.assign({}, pre, {desc:'', cast:[], media:pre.media||'movie'}); paintMovie(MV); }
    else box.innerHTML = '<div class="empty">Не удалось загрузить 😕<br>'+escTx(e.message)+'</div>';
  }
}
function paintMovie(m){
  const box = $('#scr-movie');
  const fav = isFav(tvId(m));
  let html = '<div class="mv-back">'+(m.backdrop?'<img src="'+backURL(m.backdrop)+'" alt="">':'')+'</div>'
    + '<div class="mv-wrap"><div class="mv-poster">'+(m.poster?'<img src="'+posterURL(m.poster)+'" alt="">':'')+'</div>'
    + '<div class="mv-info">'
    + '<div class="mv-title">'+escTx(m.title)+'</div>'
    + ((m.orig && m.orig!==m.title)?'<div class="mv-orig">'+escTx(m.orig)+'</div>':'')
    + '<div class="mv-meta"><span class="rate">★ '+(m.rating||'—')+'</span><span>'+escTx(m.year)+'</span>'
    + (m.runtime?'<span>'+m.runtime+' мин</span>':'')

let plHls = null, plHideT = 0;
function openPlayer(url, title){
  const P = $('#player'), v = $('#pvVideo');
  if(!P || !v) return;
  $('#pvTitle').textContent = title || '';
  P.classList.add('on');
  pvPushed = false;
  try{ history.pushState({pv:1}, ''); pvPushed = true; }catch(e){}
  if(plHls){ try{plHls.destroy();}catch(e){} plHls = null; }
  try{ v.pause(); }catch(e){}
  v.removeAttribute('src'); v.load();
  const start = ()=>{ pvShowUI(); v.play().catch(()=>{}); };
  if(/\.m3u8($|\?)/i.test(url) && window.Hls && Hls.isSupported()){
    plHls = new Hls({maxBufferLength:30});
    plHls.loadSource(url); plHls.attachMedia(v);
    plHls.on(Hls.Events.MANIFEST_PARSED, start);
    plHls.on(Hls.Events.ERROR, (ev,data)=>{ if(data && data.fatal) toast('Ошибка потока 😕'); });
  } else { v.src = url; start(); }
  buildPvBtns();
  v.ontimeupdate = pvTick;
  v.onplay = ()=>{ pvShowUI(); updPvPlay(); };
  v.onpause = ()=>{ pvShowUI(); updPvPlay(); };
  v.onclick = ()=>pvToggleUI();
}
function buildPvBtns(){
  $('#pvRow').innerHTML =
    '<button class="pv-btn" data-a="back">'+ICO.back+'</button>'
    + '<button class="pv-btn" data-a="rw"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M11 17l-5-5 5-5M18 17l-5-5 5-5"/></svg></button>'
    + '<button class="pv-btn" data-a="play" id="pvPlayBtn">'+ICO.play+'</button>'
    + '<button class="pv-btn" data-a="ff"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M13 17l5-5-5-5M6 17l5-5-5-5"/></svg></button>'
    + '<button class="pv-btn" data-a="full"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 3H5a2 2 0 0 0-2 2v3M16 3h3a2 2 0 0 1 2 2v3M8 21H5a2 2 0 0 1-2-2v-3M16 21h3a2 2 0 0 0 2-2v-3"/></svg></button>'
    + '<div class="pv-time" id="pvTime">0:00 / 0:00</div>';
  $('#pvRow').querySelectorAll('.pv-btn').forEach(b=>b.onclick=()=>pvAct(b.dataset.a));
  updPvPlay();
}
function updPvPlay(){
  const b = $('#pvPlayBtn'); if(!b) return;
  const v = $('#pvVideo');
  b.innerHTML = (v && !v.paused)
    ? '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg>'
    : ICO.play;
}
function pvAct(a){
  const v = $('#pvVideo');
  if(a==='back') closePlayer();
  else if(a==='play'){ v.paused ? v.play().catch(()=>{}) : v.pause(); }
  else if(a==='rw'){ try{ v.currentTime = Math.max(0, v.currentTime-10); }catch(e){} pvSeekFeed('−10 сек'); }
  else if(a==='ff'){
    try{
      const mx = (v.seekable && v.seekable.length) ? v.seekable.end(v.seekable.length-1) : (v.duration||0);
      v.currentTime = Math.min(mx, v.currentTime+10);
    }catch(e){}
    pvSeekFeed('+10 сек');
  }
  else if(a==='full'){ pvToggleFull(); return; }
  pvShowUI();
}
function pvShowUI(){
  $('#player').classList.add('showui');
  clearTimeout(plHideT);
  plHideT = setTimeout(()=>$('#player').classList.remove('showui'), 3200);
}
function pvToggleUI(){
  const P = $('#player');
  if(P.classList.contains('showui')) P.classList.remove('showui');
  else pvShowUI();
}
function pvTick(){
  const v = $('#pvVideo'); if(!v || !v.duration) return;
  const f = t=>{ t=Math.max(0,Math.floor(t||0)); return Math.floor(t/60)+':'+String(t%60).padStart(2,'0'); };
  const fill = $('#pvFill'), tm = $('#pvTime');
  if(fill) fill.style.width = (v.currentTime/v.duration*100)+'%';
  if(tm) tm.textContent = f(v.currentTime)+' / '+f(v.duration);
}
function closePlayer(){
  const P = $('#player'), v = $('#pvVideo');
  try{ v.pause(); }catch(e){}
  if(plHls){ try{plHls.destroy();}catch(e){} plHls = null; }
  P.classList.remove('on','showui');
  if(document.activeElement && P.contains(document.activeElement)){ try{document.activeElement.blur();}catch(e){} }
  if(pvPushed){ pvPushed = false; try{ history.back(); }catch(e){} }
}

function pvBtnMove(dir){
  const btns = [...document.querySelectorAll('#player.on .pv-btn')];
  const i = btns.indexOf(document.activeElement);
  const n = dir==='left' ? i-1 : i+1;
  if(n>=0 && n<btns.length) navFocus(btns[n]);
  else if(document.activeElement) try{document.activeElement.blur();}catch(e){}
}
let pvSeekT = null;
function pvSeekFeed(txt){
  const P = $('#player');
  let el = $('#pvSeek');
  if(!el){ el = document.createElement('div'); el.id = 'pvSeek'; P.appendChild(el); }
  el.textContent = txt;
  el.classList.add('on');
  clearTimeout(pvSeekT);
  pvSeekT = setTimeout(()=>el.classList.remove('on'), 900);
}
function pvToggleFull(){
  try{
    if(document.fullscreenElement || document.webkitFullscreenElement){
      if(document.exitFullscreen) document.exitFullscreen().catch(()=>{});
      else if(document.webkitExitFullscreen) document.webkitExitFullscreen();
    } else {
      const el = document.documentElement;
      const p = el.requestFullscreen ? el.requestFullscreen()
        : (el.webkitRequestFullscreen ? el.webkitRequestFullscreen() : null);
      if(p && p.catch) p.catch(()=>toast('Во весь экран не вышло 😕'));
    }
  }catch(e){}
  pvShowUI();
}
document.addEventListener('keydown', e=>{
  const P = $('#player');
  if(!P.classList.contains('on')) return;
  const k = e.key, kc = e.keyCode || e.which || 0;
  const ae = document.activeElement;
  const onBtn = ae && ae.classList && ae.classList.contains('pv-btn') && P.contains(ae);
  const isBack = k==='Escape' || k==='BrowserBack' || k==='GoBack' || kc===4 || kc===8 || kc===461 || kc===10009;
  if(isBack){ e.preventDefault(); e.stopPropagation(); closePlayer(); return; }
  if((k==='Enter'||kc===13||k===' '||kc===32) && onBtn) return; /* фокус на кнопке — пусть сработает её клик */
  e.stopPropagation();
  if(kc===37 || k==='ArrowLeft'){ e.preventDefault(); onBtn ? pvBtnMove('left') : pvAct('rw'); }
  else if(kc===39 || k==='ArrowRight'){ e.preventDefault(); onBtn ? pvBtnMove('right') : pvAct('ff'); }
  else if(kc===38 || k==='ArrowUp'){ e.preventDefault(); pvShowUI(); if(!onBtn){ const b=P.querySelector('.pv-btn'); if(b) navFocus(b); } }
  else if(kc===40 || k==='ArrowDown'){ e.preventDefault(); pvShowUI(); if(onBtn && ae) try{ae.blur();}catch(_){} }
  else if(k==='Enter' || kc===13 || k===' ' || kc===32){ e.preventDefault(); pvAct('play'); }
}, true);

/* =================== LUMIO =================== */
function onlCleanName(s){
  return String(s||'').replace(/<[^>]*>/g,'').trim();
}
function onlParams(m){
  const q = [];
  q.push('id='+encodeURIComponent(m.id||''));
  q.push('title='+encodeURIComponent(m.title||''));
  q.push('original_title='+encodeURIComponent(m.orig||''));
  q.push('serial='+(m.media==='tv'?1:0));
  q.push('year='+String(m.date||'').slice(0,4));
  q.push('source=tmdb');
  q.push('rchtype=');
  return q.join('&');
}
function onlParse(html){
  const dom = new DOMParser().parseFromString(html, 'text/html');
  const out = [];
  dom.querySelectorAll('.videos__item[data-json]').forEach(el=>{
    let j = null;
    try{ j = JSON.parse(el.getAttribute('data-json')); }catch(_){}
    if(!j || !j.url) return;
    const t = el.querySelector('.videos__item-title');
    out.push({
      method: j.method || 'play',
      url: j.url,
      title: (t ? t.textContent.trim() : '') || j.translate || j.title || 'Смотреть',
      voice: j.translate || ''
    });
  });
  return out;
}
async function vwLumioInit(){
  const tok = vw.token, m = vw.m;
  vw.srcs = []; vw.srcIdx = 0; vw.seasons = []; vw.seasonIdx = 0; vw.eps = [];
  vwPillsHTML([]); vwSetWatch(null); vwSetSub(''); vwSetQ('');
  vwLoading('Ищу источники…');
  try{
    const r = await fetch(MITSU + '/lite/events?life=false&' + onlParams(m));
    if(!r.ok) throw new Error('http');
    const arr = await r.json();
    const srcs = (Array.isArray(arr)?arr:[]).filter(s=>s && s.show!==false && s.url);
    if(!vwAlive(tok)) return;
    if(!srcs.length){ vwEmpty('Источников не нашлось 😕'); return; }
    vw.srcs = srcs;
    vwLumioLoad(0, tok);
  }catch(e){ if(vwAlive(tok)) vwEmpty('Не получилось связаться с источником 😕'); }
}
async function vwLumioLoad(srcIdx, tok){
  vw.srcIdx = srcIdx;
  const s = vw.srcs[srcIdx];
  const url = s.url + (s.url.includes('?')?'&':'?') + onlParams(vw.m);
  vwLoading('Загружаю…');
  try{
    const r = await fetch(url);
    if(!r.ok) throw new Error('http');
    const items = onlParse(await r.text());
    if(!vwAlive(tok)) return;
    if(!items.length){ vwEmpty('Тут пусто 😕'); return; }
    if(items[0].method==='play'){ vw.voices = items; vwLumioRenderVoices(); }
    else { vw.seasons = items; vw.seasonIdx = 0; vwLumioLoadSeason(0, tok); }
  }catch(e){ if(vwAlive(tok)) vwEmpty('Ошибка загрузки 😕'); }
}
async function vwLumioLoadSeason(si, tok){
  vw.seasonIdx = si;
  vwLoading('Загружаю серии…');
  try{
    const r = await fetch(vw.seasons[si].url);
    if(!r.ok) throw new Error('http');
    const items = onlParse(await r.text());
    if(!vwAlive(tok)) return;
    vw.eps = items;

/* =================== ALPAC =================== */
const ALPAC = 'https://beta.l-vid.online';
function alpacUid(){
  let u = LS.get('alpac_uid','');
  if(!/^[0-9a-f]{12}$/.test(u||'')){
    try{
      const a = new Uint8Array(6);
      if(window.crypto && crypto.getRandomValues) crypto.getRandomValues(a);
      else for(let i=0;i<6;i++) a[i] = Math.floor(Math.random()*256);
      u = Array.from(a).map(b=>('0'+b.toString(16)).slice(-2)).join('');
    }catch(_){ u = (Math.random().toString(16).slice(2)+Date.now().toString(16)).slice(0,12); }
    LS.set('alpac_uid', u);
  }
  return u;
}
function alpacToken(){ return String(LS.get('alpac_token','')||'').trim(); }
function alpacAbs(u){ u = String(u||''); return /^https?:\/\//i.test(u) ? u : ALPAC + (u.charAt(0)==='/' ? u : '/'+u); }
function alpacParams(m){
  const q = [];
  q.push('id='+encodeURIComponent(String(m.id||'').replace(/^tv/,'')));
  q.push('title='+encodeURIComponent(m.title||''));
  q.push('original_title='+encodeURIComponent(m.orig||''));
  q.push('serial='+(m.media==='tv'?1:0));
  q.push('year='+String(m.date||'').slice(0,4));
  q.push('source=tmdb'); q.push('rchtype=');
  return q.join('&');
}
function alpacAuthQS(){
  let q = 'uid='+encodeURIComponent(alpacUid());
  const t = alpacToken();
  if(t) q += '&token='+encodeURIComponent(t);
  return q;
}
function alpacBestQ(q){
  let best = '', bestN = -1;
  Object.keys(q||{}).forEach(k=>{
    const mm = String(k).match(/(\d{3,4})/);
    const n = mm ? +mm[1] : 0;
    if(n >= bestN){ bestN = n; best = q[k]; }
  });
  return best || q[Object.keys(q||{})[0]] || '';
}
function alpacSaveToken(j){
  const t = j && (j.token || j.access_token || j.auth_token || (j.data && j.data.token));
  if(typeof t==='string' && t.trim()){ LS.set('alpac_token', t.trim()); return true; }
  return false;
}
function alpacHeaders(){
  const t = alpacToken();
  return t ? {'X-Alpac-Token': t, 'X-Lampac-Token': t} : {};
}
async function alpacFetchEvents(m){
  const r = await fetch(ALPAC+'/lite/events?life=true&'+alpacParams(m)+'&'+alpacAuthQS(), {headers: alpacHeaders()});
  if(!r.ok) throw new Error('http');
  return r.json();
}
async function vwAlpacInit(){
  try{ if(vw && vw.alpacPoll) clearInterval(vw.alpacPoll); }catch(_){}
  const tok = vw.token, m = vw.m;
  vw.srcs = []; vw.srcIdx = 0; vw.seasons = []; vw.seasonIdx = 0; vw.eps = []; vw.voices = [];
  vwPillsHTML([]); vwSetWatch(null); vwSetSub(''); vwSetQ('');
  vwLoading('Подключаюсь к Alpac…');
  try{
    const ev = await alpacEvents(m, tok);
    if(!vwAlive(tok)) return;
    if(ev.auth){ vwAlpacAuth(ev.auth, tok); return; }
    if(!ev.sources.length){ vwEmpty('Источников не нашлось 😕'); return; }
    vw.srcs = ev.sources;
    if(ev.sources.length===1) vwAlpacLoad(0, tok);
    else vwAlpacRenderSources(tok);
  }catch(e){ if(vwAlive(tok)) vwEmpty('Не получилось связаться с Alpac 😕'); }
}
async function alpacEvents(m, tok){
  let j = await alpacFetchEvents(m);
  if(j && j.accsdb && alpacSaveToken(j)) j = await alpacFetchEvents(m);
  if(j && j.accsdb) return {auth:j};
  if(j && j.life && j.memkey){
    let best = [], stable = 0;
    for(let i=0;i<24;i++){
      if(i>0) await new Promise(r2=>setTimeout(r2, 1500));
      if(!vwAlive(tok)) throw new Error('gone');
      let r3 = null;
      try{ r3 = await fetch(ALPAC+'/lifeevents?memkey='+encodeURIComponent(j.memkey)+'&'+alpacAuthQS(), {headers: alpacHeaders()}); }catch(_){ continue; }
      if(!r3.ok) continue;
      const j3 = await r3.json().catch(()=>null);
      if(!j3) continue;
      if(j3.accsdb){ alpacSaveToken(j3); return {auth:j3}; }
      const onl = Array.isArray(j3.online) ? j3.online : (Array.isArray(j3) ? j3 : []);
      if(onl.length > best.length){ best = onl; stable = 0; } else { stable++; }
      if(j3.ready || stable>=3) break;
    }
    j = best;
  }
  if(j && j.accsdb) return {auth:j};
  const arr = Array.isArray(j) ? j : [];
  if(arr.length){
    try{
      const r4 = await fetch(ALPAC+'/tg/auth/status?uid='+encodeURIComponent(alpacUid()), {headers: alpacHeaders()});
      if(r4.ok){ const j4 = await r4.json(); if(j4 && j4.authorized && j4.token) LS.set('alpac_token', j4.token); }
    }catch(_){}
  }
  return {sources: arr.filter(s=>s && s.show!==false && s.url)};
}
function vwAlpacAuth(er, tok){
  if(!vw || vw.kind!=='alpac') return;
  try{ if(vw.alpacPoll) clearInterval(vw.alpacPoll); }catch(_){}
  alpacSaveToken(er);
  vwPillsHTML([]); vwSetWatch(null);
  vwSetSub('Вход через Telegram');
  const el = $('#vwList'); if(!el) return;
  el.innerHTML = `<div class="alp-auth">
    ${er.qr?`<img class="alp-qr" src="${er.qr}" alt="QR">`:''}
    <div class="alp-code">${escTx(er.code||'')}</div>
    <div class="alp-msg">Отправь этот код боту <b>${escTx(er.bot||'@go_lampa_testbot')}</b> в Telegram<br>или просто сканируй QR</div>
    <div class="alp-status" id="alpStatus"><span class="alp-dot"></span>Жду подтверждения…</div>
    <button class="alp-refresh" id="alpRefresh">Обновить код</button>
  </div>`;
  $('#alpRefresh').onclick = ()=>vwAlpacInit();
  vw.alpacPoll = setInterval(async ()=>{
    if(!vwAlive(tok)){ try{ clearInterval(vw.alpacPoll); }catch(_){} return; }
    try{
      const r = await fetch(ALPAC+'/tg/auth/check?code='+encodeURIComponent(er.code||''));
      if(!r.ok) return;
      const j = await r.json();
      if(!j) return;
      const st = $('#alpStatus');
      if(j.status==='approved' && j.token){
        try{ clearInterval(vw.alpacPoll); }catch(_){}
        alpacSaveToken(j);
        toast('Alpac подключён ✅');
        if(vwAlive(tok)) vwAlpacInit();
      }else if(j.status==='claimed'){
        if(st) st.innerHTML = '<span class="alp-dot"></span>Код принят, жду одобрения…';
      }else if(j.status==='rejected'){
        try{ clearInterval(vw.alpacPoll); }catch(_){}
        if(st) st.innerHTML = '<span class="alp-dot"></span>Запрос отклонён администратором';
      }else if(j.status==='expired'){
        try{ clearInterval(vw.alpacPoll); }catch(_){}
        if(vwAlive(tok)) vwAlpacInit();
      }
    }catch(_){}
  }, 3000);
  vw.render = ()=>vwAlpacAuth(er, tok);
}
function vwAlpacRenderSources(tok){
  if(!vw || vw.kind!=='alpac') return;
  vwPillsHTML([]);
  vwSetWatch(null);
  vwSetSub('Alpac · выбери источник');
  const el = $('#vwList'); if(!el) return;

function vwAlpacMaybeAuth(text, tok){
  if(text.indexOf('"accsdb"')===-1) return false;
  try{
    const j = JSON.parse(text);
    if(j && j.accsdb){ if(vwAlive(tok)) vwAlpacAuth(j, tok); return true; }
  }catch(_){}

async function vwAlpacLoad(si, tok){
  vw.srcIdx = si;
  const s = vw.srcs[si];
  vwLoading('Загружаю…');
  try{
    const url = alpacAbs(s.url) + (String(s.url).includes('?')?'&':'?') + alpacParams(vw.m) + '&' + alpacAuthQS();
    const r = await fetch(url, {headers: alpacHeaders()});
    if(!r.ok) throw new Error('http');
    const html = await r.text();
    if(!vwAlive(tok)) return;
    if(vwAlpacMaybeAuth(html, tok)) return;
    vwAlpacGot(html, tok, false);
  }catch(e){ if(vwAlive(tok)) vwEmpty('Ошибка загрузки 😕'); }
}
async function vwAlpacFollow(url, tok, fromVoice){
  vwLoading('Загружаю…');
  try{
    const u = alpacAbs(url) + (String(url).includes('?')?'&':'?') + alpacParams(vw.m) + '&' + alpacAuthQS();
    const r = await fetch(u, {headers: alpacHeaders()});

    if(!vwAlive(tok)) return;
    const text = await r.text();
    if(vwAlpacMaybeAuth(text, tok)) return;
    vwAlpacGot(text, tok, !!fromVoice);
  }catch(e){ if(vwAlive(tok)) vwEmpty('Ошибка загрузки 😕'); }

function vwAlpacGot(html, tok, fromVoice){
  const dom = new DOMParser().parseFromString(html, 'text/html');
  const items = [], buttons = [];
  dom.querySelectorAll('.videos__item[data-json]').forEach(el=>{
    let j = null;
    try{ j = JSON.parse(el.getAttribute('data-json')); }catch(_){}
    if(!j || !j.url) return;
    const s = el.getAttribute('s'), e = el.getAttribute('e');
    items.push({method: j.method||'play', url: String(j.url),
      title: onlCleanName(el.textContent).slice(0,140) || j.title || 'Смотреть',
      season: s!==null ? +s : null, episode: e!==null ? +e : null,
      quality: (j.quality && typeof j.quality==='object') ? j.quality : null,
      voice: j.translate || ''});
  });
  dom.querySelectorAll('.videos__button[data-json]').forEach(el=>{
    let j = null;
    try{ j = JSON.parse(el.getAttribute('data-json')); }catch(_){}
    if(!j || !j.url) return;
    buttons.push({title: onlCleanName(el.textContent).slice(0,90) || '—', url: String(j.url), active: el.classList.contains('active')});
  });
  const videos = items.filter(i=>i.method==='play' || i.method==='call' || i.method==='iframe');
  if(videos.length){
    if(buttons.length && !fromVoice){ vw.voices = buttons; vwAlpacRenderVoices(tok); }
    else if(vw.m.media==='tv'){ vw.eps = videos; vwAlpacRenderEps(tok); }
    else { vw.voices = videos; vwAlpacRenderMovieVoices(tok); }
  } else if(items.length){
    if(items.length===1 && items[0].method==='link'){ vwAlpacFollow(items[0].url, tok, false); }
    else { vw.seasons = items; vwAlpacRenderSeasons(tok); }
  } else {
    vwEmpty('Тут пусто 😕');
  }
}

function vwAlpacEpNum(e, i){ return (e.episode!=null && e.episode>0) ? String(e.episode) : String(i+1); }
function vwAlpacRenderEps(tok){
  if(!vw || vw.kind!=='alpac') return;
  vwAlpacPills();
  const m = vw.m, eps = vw.eps;
  const sNum = (eps.length && eps[0].season!=null) ? eps[0].season : (vw.seasonIdx+1);
  const total = eps.length;
  const watched = vwCountW('a'+m.id, total);
  let target = eps.findIndex((e,i)=>!vwIsW('a'+m.id, 's'+sNum+'e'+vwAlpacEpNum(e,i)));
  if(target===-1) target = 0;
  const epT = eps.length ? vwAlpacEpNum(eps[target], target) : null;

  vwSetSub(`<b>${escTx(vwSrcName(vw.srcs[vw.srcIdx], vw.srcIdx))}</b> · ${sNum} сезон<br>Просмотрено ${watched} из ${total} · осталось ${total-watched}`);
  const el = $('#vwList'); if(!el) return;
  el.innerHTML = (vw.voices && vw.voices.length ? `<button class="vw-backline" id="vwToVoices">‹ Озвучки</button>` : '') +
    `<div class="vw-sec-t">Серии · ${total}</div><div class="vw-list">` + eps.map((e,i)=>{
    const num = vwAlpacEpNum(e, i);
    const w = vwIsW('a'+m.id, 's'+sNum+'e'+num);
    const sub = (e.voice && e.voice!==e.title) ? e.voice : (e.title && !/^\d+\s*серия/i.test(e.title) ? e.title : '');

      <span class="vw-thumb" data-ep="${escAttr(num)}"><span class="vw-num">${escTx(num)}</span></span>

        <span class="vw-eps">${escTx(sub)}</span>
        <span class="vw-prog"><i style="width:${w?100:0}%"></i></span>
      </span>
      ${w?'<span class="vw-side"><span class="vw-done">✓</span></span>':''}
    </button>`;
  }).join('') + '</div>';
  el.querySelectorAll('.vw-ep').forEach(b=>b.onclick=()=>vwAlpacPlay(eps[+b.dataset.i], +b.dataset.i, tok));

}
async function vwAlpacPlay(it, ei, tok){
  const m = vw.m;
  vwLoading('Получаю ссылку…');
  try{
    const res = await vwAlpacResolve(it);
    if(!vwAlive(tok)) return;
    if(res.iframe){ vwAlpacIframe(res.iframe); return; }
    if(m.media==='tv' && ei>=0){
      const sNum = (vw.eps[ei] && vw.eps[ei].season!=null) ? vw.eps[ei].season : (vw.seasonIdx+1);
      vwMarkW('a'+m.id, 's'+sNum+'e'+vwAlpacEpNum(vw.eps[ei], ei));
    }
    const epT = (m.media==='tv' && ei>=0) ? vwAlpacEpNum(vw.eps[ei], ei) : null;
    const title = m.title + (epT ? ' · серия '+epT : '') + (it.title ? ' · '+it.title : '');
    vwAskPlayer(res.url, title, res.subs||[], m, {
      file: it.title || '',
      source: 'Alpac · ' + vwSrcName(vw.srcs[vw.srcIdx], vw.srcIdx),
      voice: it.voice || '',
    });
  }catch(e){
    if(!vwAlive(tok)) return;
    if(e && e.auth){ vwAlpacAuth(e.auth, tok); return; }
    vwEmpty('Не получилось получить ссылку 😕');
    setTimeout(()=>{ if(vwAlive(tok) && vw.render) vw.render(); }, 1400);
  }
}
async function vwAlpacResolve(it){
  if(it.method==='play'){
    const u = (it.quality ? alpacBestQ(it.quality) : '') || it.url;
    return {url: u};
  }
  if(it.method==='iframe') return {iframe: it.url};
  const u = alpacAbs(it.url) + (String(it.url).includes('?')?'&':'?') + alpacAuthQS();
  const r = await fetch(u, {headers: alpacHeaders()});
  if(!r.ok) throw new Error('http');
  const j = await r.json();
  if(j && j.accsdb) throw {auth: j};
  if(j && j.method==='iframe' && j.url) return {iframe: j.url};
  if(j && j.url){
    const qq = (j.quality && typeof j.quality==='object') ? j.quality : ((j.qualitys && typeof j.qualitys==='object') ? j.qualitys : null);
    return {url: (qq ? alpacBestQ(qq) : '') || j.url, subs: j.subtitles || []};
  }
  throw new Error('nolink');
}
function vwAlpacIframe(url){
  const ov = document.createElement('div');
  ov.style.cssText = 'position:fixed;inset:0;z-index:9999;background:#000';
  const fr = document.createElement('iframe');
  fr.setAttribute('src', url);
  fr.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;border:0;background:#000';
  fr.setAttribute('allow', 'autoplay; fullscreen; encrypted-media');
  fr.setAttribute('allowfullscreen', '');
  const x = document.createElement('button');
  x.textContent = '✕';
  x.style.cssText = 'position:absolute;top:14px;left:14px;z-index:2;width:42px;height:42px;border-radius:50%;border:1px solid rgba(255,255,255,.3);background:rgba(0,0,0,.55);color:#fff;font-size:17px;cursor:pointer';
  x.onclick = ()=>ov.remove();
  ov.appendChild(fr); ov.appendChild(x);
  document.body.appendChild(ov);
}

  const url = fxProxy() + 'http://filmixapp.vip/api/v2/' + path + '?' + fxTokenQS() + (extra ? '&' + extra : '');
  const r = await fetch(url);
  if(!r.ok) throw new Error('http ' + r.status);
  return r.json();
}
function fxNorm(s){ return String(s||'').toLowerCase().replace(/[^a-zа-я0-9]/g,''); }
function fxQualities(link){
  const m = String(link||'').match(/\[([\d,\s]*)\]/);
  if(!m) return [];
  return m[1].split(',').map(q=>parseInt(q,10)).filter(q=>q>0 && q<=fxMaxQ);
}
function fxFileUrl(link, q){
  return String(link).replace(/_\[([\d,\s]*)\]\.mp4/i, '_'+q+'.mp4')
    .replace('%s.mp4', q+'.mp4')
    .replace(/^http:\/\//i, 'https://');
}
function fxBlocked(name){ return typeof name==='string' && name.toLowerCase().indexOf('заблокировано ')===0; }
function fxIsSerial(pl){
  return pl && pl.playlist && typeof pl.playlist==='object' && !Array.isArray(pl.playlist) && Object.keys(pl.playlist).length>0;
}
/* =================== FILMIX =================== */
function fxMatch(json, m){
  if(!Array.isArray(json) || !json.length) return null;
  const year = parseInt(String(m.date||'').slice(0,4)) || 0;
  const orig = m.orig || '';
  const cards = json.filter(c=>{
    const y = parseInt(c.year || String(c.alt_name||'').split('-').pop());
    return y > year-2 && y < year+2;
  });
  let card = cards.find(c=>c.year==year && fxNorm(c.original_title)===fxNorm(orig));
  if(!card) card = cards.find(c=>fxNorm(c.original_title)===fxNorm(orig));
  if(!card && cards.length===1) card = cards[0];
  return card || null;
}

function vwFxSeasons(playlist){
  vw.seasons = Object.keys(playlist).sort((a,b)=>parseInt(a)-parseInt(b));

function vwFxSeasonLabel(sKey){ return String(sKey)==='-1' ? '1' : String(sKey); }
/* Filmix: playlist[сезон][озвучка][id серии] = файл — как в оригинальном плагине */
function vwFxSeasonEps(){
  const sKey = vw.seasons[vw.seasonIdx];
  const seasonObj = vw.playlist[sKey] || {};
  const eps = {};
  Object.keys(seasonObj).forEach(vName=>{
    if(fxBlocked(vName)) return;
    let vm = seasonObj[vName];
    if(Array.isArray(vm)){ const m2 = {}; vm.forEach((v,i)=>{ m2[String(i+1)] = v; }); vm = m2; }
    Object.keys(vm).forEach(id=>{
      const f = vm[id];
      if(!f || !f.link) return;
      const qArr = (Array.isArray(f.qualities) && f.qualities.length) ? f.qualities : fxQualities(f.link);
      const qs = qArr.map(q=>parseInt(q,10)).filter(q=>q>0 && q<=fxMaxQ);
      if(!qs.length) return;
      const q = Math.max.apply(null, qs);
      const url = fxFileUrl(f.link, q);
      let sNum = vwFxSeasonLabel(sKey), eNum = parseInt(id, 10);
      const mSe = url.match(/s(\d+)e(\d+?)_\d+\.mp4/i);
      if(mSe){ sNum = mSe[1]; eNum = parseInt(mSe[2], 10); }
      if(isNaN(eNum)) return;
      const key = sNum + 'x' + eNum;
      if(!eps[key]) eps[key] = {sNum, eNum, voices: []};
      eps[key].voices.push({voice: vName, q, url});
    });
  });
  return Object.keys(eps).sort((a,b)=>{
    const pa = a.split('x').map(Number), pb = b.split('x').map(Number);
    return (pa[0]-pb[0]) || (pa[1]-pb[1]);
  }).map(k=>eps[k]);
}
function vwFxVoicePill(eps){
  const seen = [];
  eps.forEach(e=>(e.voices||[]).forEach(v=>{ if(seen.indexOf(v.voice)===-1) seen.push(v.voice); }));
  if(!seen.length) return [];
  let cur = vw.voice ? seen.indexOf(vw.voice) : 0;
  if(cur<0) cur = 0;
  return [{label:'Озвучка', value: seen[cur],
    onPick: ()=>openOptSheetK('Озвучка', seen.map(s=>({t:s})), cur, i=>{ vw.voice = seen[i]; vwFxRenderEps(); })}];
}

  const el = $('#vwList'); if(!el) return;
  el.innerHTML = `<div class="vw-sec-t">Серии · ${total}</div><div class="vw-list">` + eps.map((e,i)=>{
    const w = vwIsW('f'+m.id, 's'+e.sNum+'e'+e.eNum);

      <span class="vw-epbody">

        <span class="vw-eps">${escTx(vn)}${vs.length>2?' · …':''}</span>

      </span>
      ${w?'<span class="vw-side"><span class="vw-done">✓</span></span>':''}
    </button>`;
  }).join('') + '</div>';
  el.querySelectorAll('.vw-ep').forEach(b=>b.onclick=()=>vwFxPlayEp(+b.dataset.i));

/* Прокси для http-серверов: вставляешь только адрес сервера, остальное — само.
   Голый IP оборачивается в *.nip.io — воркерам Cloudflare нельзя ходить на IP напрямую. */
const TS_PROXY = 'https://torrserver.flyugertdiana.workers.dev';
function tsBase(){
  const h = (state.tsUrlHttp||'').trim().replace(/\/+$/,'');
  if(h){
    if(/^https:\/\//i.test(h) || h.indexOf(TS_PROXY)===0) return h;
    const u = h.replace(/^(https?:\/\/)(\d{1,3}(?:\.\d{1,3}){3})(:\d+)?/i,
      (m,p,ip,port)=> p + ip + '.nip.io' + (port||''));
    return TS_PROXY + '/' + u;
  }
  return (state.tsUrl||'').replace(/\/+$/,'') || 'http://127.0.0.1:8090';
}
async function tsAPI(body){
  const r = await fetch(tsBase() + '/torrents', {
    method:'POST', headers:{'Content-Type':'text/plain'}, body: JSON.stringify(body)
  });
  if(!r.ok) throw new Error('HTTP '+r.status);
  return r.json();
}
function tsStreamURL(ts, link, idx, name){
  return ts + '/stream/' + encodeURIComponent(name||'video') + '?link=' + encodeURIComponent(link) + '&index=' + idx + '&play';
}

/* ---------- внешний плеер (VLC) ---------- */
function vlcIntent(u){
  try{
    const p = new URL(u);
    return 'intent://' + p.host + p.pathname + p.search +
      '#Intent;action=android.intent.action.VIEW;scheme=' + p.protocol.replace(':','') +
      ';type=video/*;package=org.videolan.vlc;end';
  }catch(e){ return null; }
}
/* Запуск VLC — как у Lampa: прямой переход по intent://.
   Важно: вызывать СИНХРОННО в обработчике клика — без жеста пользователя
   Chrome на Android TV молча блокирует intent:// (поэтому торренты шли
   через асинхронный playTorrent и VLC не открывался). */
function vlcLaunch(url){
  const iu = vlcIntent(url);
  if(!iu){ toast('Не получилось открыть ссылку'); return; }
  toast('Открываю в VLC…');
  try{ window.location.assign(iu); }catch(e){ toast('Не вышло открыть VLC'); }
}

async function playTorrent(t, m){
  const ts = tsBase();
  toast('Подключаюсь к TorrServer…');
  try{ const e = await fetch(ts+'/echo', {cache:'no-store'}); if(!e.ok) throw 0; }
  catch(err){ toast('TorrServer не отвечает · проверь адрес в Профиле'); return; }
  let files = null, subs = [], hash = null;
  try{
    const added = await tsAPI({action:'add', link:t.MagnetUri});
    const th = added && (added.hash || (added.torrent && added.torrent.hash));
    if(th) hash = String(th).toLowerCase();
    for(let i=0; i<20 && hash; i++){
      let tor = null;
      try{ const g = await tsAPI({action:'get', hash}); tor = (g && g.torrent) || g || {}; }
      catch(e){ break; }
      const fs = tor.file_stats || tor.files || [];
      const vids = fs.filter(f=>isVideo(f.path||f.name))
        .map(f=>({id:f.id, path:f.path||f.name, size:f.length||f.size||0}))
        .filter(f=>f.id);
      if(vids.length){
        files = vids;
        subs = fs.filter(f=>/\.(srt|vtt)$/i.test(f.path||f.name||''))
          .map(f=>({id:f.id, name:shortName(f.path||f.name), url:tsStreamURL(ts, hash, f.id, f.path||f.name)}))
          .filter(f=>f.id);
        break;
      }
      await new Promise(r=>setTimeout(r,1500));
    }
  }catch(e){ /* ниже — прямой фолбэк */ }
  if(files && files.length===1){ playUrl(tsStreamURL(ts, hash, files[0].id, t.Title), t.Title); return; }
  if(files && files.length>1){
    torSubsCache = subs;
    const sorted = files.slice().sort((a,b)=>b.size-a.size);
    const el = $('#vwList');
    if(el && vw && vw.kind==='tor'){
      vw.render = vwTorRender;
      el.innerHTML = `<button class="vw-backline" id="vwToTor">‹ Раздачи</button>
        <div class="vw-sec-t">Выбери файл · ${sorted.length}</div><div class="vw-list">` +
        sorted.map(f=>`<button class="vw-voice" data-f="${f.id}"><span>${escTx(shortName(f.path))}<div class="vs">${fmtSize(f.size)}</div></span><span style="color:var(--muted);font-size:19px;flex:0 0 auto">›</span></button>`).join('') + '</div>';
      $('#vwToTor').onclick = ()=>vwTorRender();
      el.querySelectorAll('.vw-voice').forEach(x=>x.onclick=()=>{
        playUrl(tsStreamURL(ts, hash, x.dataset.f, t.Title), t.Title);
      });
      return;
    }
  }
  // Фолбэк без чтения API: стрим первого файла напрямую по magnet
  playUrl(tsStreamURL(ts, t.MagnetUri, 1, t.Title), t.Title);
}
/* Мгновенный запуск лучшей раздачи прямо в клике (без ожидания API TorrServer):
   только так сохраняется жест пользователя и Chrome не блокирует intent:// */
function playTorrentNow(t, m){
  const ts = tsBase();
  const url = tsStreamURL(ts, t.MagnetUri, 1, t.Title);
  const title = (m && (m.title || m.name)) || t.Title || 'Торрент';
  if(state.defPlayer==='builtin'){ openPlayer(url, title); return; }
  vlcLaunch(url);
}
